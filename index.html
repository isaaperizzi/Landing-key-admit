<style>
:root{
  --bg:#FBFBFB; --ink:#252C47; --muted:#6B7280;
  --red:#D84940; --red-d:#B93B34; --surface:#FFFFFF; --soft:#EAF0FA;
  --shadow:0 1px 3px rgba(37,44,71,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; overflow-x:hidden;
  background:var(--bg);
  color:var(--ink); font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
main{
  width:100%; max-width:420px; margin:0 auto;
  padding:48px 20px 32px; display:flex; flex-direction:column; align-items:center; text-align:center;
}
.avatar{
  width:168px; height:190px; padding-top:22px;
  border:2px solid var(--ink); border-radius:84px 84px 16px 16px;
  background:#FBFBFB; display:flex; align-items:center; justify-content:center;
}
.avatar img{width:116px; height:auto; display:block}
h1{
  font-family:"Playfair Display",Georgia,"Times New Roman",serif;
  font-weight:600; font-size:2rem; line-height:1.15; margin:20px 0 6px; letter-spacing:.2px;
}
.bio{margin:0; color:var(--muted); font-size:.95rem; max-width:30ch}
.social{display:flex; gap:8px; margin:20px 0 32px; padding:0; list-style:none}
.social a{
  display:flex; width:44px; height:44px; align-items:center; justify-content:center;
  color:var(--ink); border-radius:50%; transition:color .25s ease;
}
.social a:hover,.social a:focus-visible{color:var(--red)}
.social svg{width:22px;height:22px}
.links{width:100%; display:flex; flex-direction:column; gap:14px; margin:0; padding:0; list-style:none}
.links li{opacity:0; animation:in .5s ease forwards; animation-delay:calc(var(--i) * 90ms + 150ms)}
.sep{height:6px}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.btn{
  position:relative; display:flex; align-items:center; gap:14px; width:100%; min-height:58px;
  padding:16px 20px; border-radius:14px; text-decoration:none; text-align:left;
  font-size:.95rem; font-weight:500; color:var(--ink);
  background:var(--surface); border:1px solid var(--ink); box-shadow:var(--shadow);
  transition:background-color .25s ease,color .25s ease,border-color .25s ease;
}
.btn svg{width:22px;height:22px;flex:none;color:var(--red);transition:color .25s ease}
.btn span.t{flex:1}
.btn:hover,.btn:focus-visible{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:hover svg,.btn:focus-visible svg{color:#fff}
.btn.feat{background:var(--soft)}
.btn.feat:hover,.btn.feat:focus-visible{background:var(--ink)}
.btn.cta{background:var(--red);border-color:var(--red);color:#fff}
.btn.cta svg{color:#fff}
.btn.cta:hover,.btn.cta:focus-visible{background:var(--red-d);border-color:var(--red-d)}
.badge{
  font-size:.7rem; font-weight:500; padding:3px 10px; border-radius:999px;
  background:var(--surface); color:var(--red); border:1px solid currentColor; transition:all .25s ease;
}
.cta .badge{background:transparent;color:#fff}
.feat:not(.cta) .badge{background:var(--red);color:#fff;border-color:var(--red)}
a:focus-visible{outline:2px solid var(--red); outline-offset:3px}
footer{margin-top:40px; font-size:.78rem; color:var(--muted)}
footer a{color:inherit; text-underline-offset:3px}
footer a:hover{color:var(--red)}
@media (prefers-reduced-motion:reduce){
  .links li{opacity:1; animation:none}
  *{transition-duration:.01ms !important}
}
</style>
</head>
